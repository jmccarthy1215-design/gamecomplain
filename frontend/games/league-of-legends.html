<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League of Legends Complaints — Game Complaints</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { --accent: #C69B3A; --accent-hover: #a87d2c; }

    .game-banner {
      background: linear-gradient(150deg, #060810 0%, #0A1428 55%, #08060e 100%);
      border: 1px solid rgba(198, 155, 58, 0.35);
      position: relative;
      overflow: hidden;
    }

    /* Elegant gold hex / ornate shimmer top-right */
    .game-banner::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(198,155,58,0.12) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Thin gold line at top */
    .game-banner::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(198,155,58,0.7), transparent);
      pointer-events: none;
    }

    .banner-title {
      background: linear-gradient(90deg, #C69B3A 0%, #f0d080 50%, #C69B3A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.03em;
    }

    .stat-n { color: #C69B3A; }

    .banner-badge {
      display: inline-block;
      background: rgba(198,155,58,0.1);
      border: 1px solid rgba(198,155,58,0.35);
      color: #d4aa55;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <script>window.NEXT_PUBLIC_API_URL = "https://gamecomplain.onrender.com";</script>
  <script src="/config.js"></script>
  <script src="/shared/navbar.js"></script>

  <div class="container">

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/" class="breadcrumb-link">Home</a>
      <span class="breadcrumb-sep">›</span>
      <a href="/" class="breadcrumb-link">Games</a>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">League of Legends</span>
    </nav>

    <div class="game-banner">
      <div class="banner-badge">MOBA</div>
      <h1 class="banner-title">League of Legends</h1>
      <p class="banner-sub">Champion balance, LP / ranked issues, client bugs, and toxic player complaints from the Summoner's Rift community.</p>
      <div class="banner-stats">
        <div class="stat-block">
          <div class="stat-n">4.0k</div>
          <div class="stat-l">Complaints</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">31.2k</div>
          <div class="stat-l">Upvotes</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">7.3k</div>
          <div class="stat-l">Replies</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">#1</div>
          <div class="stat-l">Top Voted</div>
        </div>
      </div>
    </div>

    <section class="feed-section">
      <div class="feed-bar">
        <span class="feed-label">LoL Issues</span>
        <span class="feed-sort">&#9650; Top Voted</span>
      </div>
      <div id="complaints-list"><p class="loading-text">Loading complaints…</p></div>
    </section>
  </div>

  <script>window.PAGE_CONFIG = { game: 'League of Legends', sort: 'votes' };</script>
  <script src="/shared/feed.js"></script>
</body>
</html>
