<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Replies to My Posts — GameComplain</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode');</script>
</head>
<body>
  <div class="container">

    <div class="page-hero" style="background:linear-gradient(135deg,rgba(77,171,247,.08),transparent)">
      <span class="page-hero-icon">&#128172;</span>
      <h1>Replies to My Posts</h1>
      <p class="page-subtitle">See what the community said on your complaints</p>
    </div>

    <div id="replies-list">
      <p class="loading-text">Loading replies…</p>
    </div>

  </div>

  <script src="/shared/navbar.js"></script>
  <script src="/shared/auth.js"></script>
  <script>
  (function () {
    var API = '/api/complaints';

    var CATEGORY_COLORS = {
      'Game Bugs':           { bg:'rgba(255,107,107,.15)', border:'rgba(255,107,107,.4)', color:'#ff8787' },
      'Broken Characters':   { bg:'rgba(255,169,77,.15)',  border:'rgba(255,169,77,.4)',  color:'#ffa94d' },
      'Stupid Mechanics':    { bg:'rgba(255,212,59,.15)',  border:'rgba(255,212,59,.4)',  color:'#ffd43b' },
      'Matchmaking Issues':  { bg:'rgba(105,219,124,.15)', border:'rgba(105,219,124,.4)', color:'#69db7c' },
      'Performance Issues':  { bg:'rgba(77,171,247,.15)',  border:'rgba(77,171,247,.4)',  color:'#74c0fc' },
      'Cheating / Exploits': { bg:'rgba(247,131,172,.15)', border:'rgba(247,131,172,.4)', color:'#f783ac' },
      'Updates / Patches':   { bg:'rgba(169,227,75,.15)',  border:'rgba(169,227,75,.4)',  color:'#a9e34b' },
      'Other':               { bg:'rgba(123,127,158,.15)', border:'rgba(123,127,158,.4)', color:'#a0a3bb' }
    };

    function escHtml(s) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(String(s)));
      return d.innerHTML;
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
    }

    function applyCategory(el, cat) {
      var c = CATEGORY_COLORS[cat] || CATEGORY_COLORS['Other'];
      el.style.background = c.bg;
      el.style.border     = '1px solid ' + c.border;
      el.style.color      = c.color;
    }

    function renderComplaintWithReplies(complaint) {
      var wrapper = document.createElement('div');
      wrapper.className = 'replies-page-block';

      // Complaint header summary
      var header = document.createElement('div');
      header.className = 'rp-complaint-header';

      var catEl = document.createElement('span');
      catEl.className = 'card-category';
      catEl.textContent = complaint.category;
      applyCategory(catEl, complaint.category);

      var gameEl = complaint.game
        ? '<span class="card-game-badge" style="margin-right:.35rem">' + escHtml(complaint.game) + '</span>'
        : '';

      header.innerHTML =
        '<div class="rp-complaint-meta">' + gameEl + catEl.outerHTML + '</div>' +
        '<h3 class="rp-complaint-title">' + escHtml(complaint.title) + '</h3>' +
        '<p class="rp-complaint-desc">' + escHtml(complaint.description) + '</p>' +
        '<p class="rp-complaint-date">Posted ' + fmtDate(complaint.createdAt) +
          ' &middot; <span class="vote-count">' + complaint.votes + '</span> votes</p>';

      wrapper.appendChild(header);

      // Replies
      var repliesDiv = document.createElement('div');
      repliesDiv.className = 'replies-list';

      if (!complaint.replies || complaint.replies.length === 0) {
        repliesDiv.innerHTML = '<p class="no-replies-text">No replies on this post yet.</p>';
      } else {
        complaint.replies.forEach(function (r) {
          var isDev = !!(r.developerTag);
          var item  = document.createElement('div');
          item.className = 'reply-item' + (isDev ? ' dev-reply' : '');
          item.innerHTML =
            (isDev ? '<div class="reply-dev-header"><span class="dev-reply-badge">&#128737; ' + escHtml(r.developerTag) + '</span></div>' : '') +
            '<p class="reply-text">' + escHtml(r.text) + '</p>' +
            '<p class="reply-date">' + fmtDate(r.createdAt) + '</p>';
          repliesDiv.appendChild(item);
        });
      }

      wrapper.appendChild(repliesDiv);
      return wrapper;
    }

    (async function () {
      var authRes = await fetch('/api/auth/me');
      if (!authRes.ok) { window.location.href = '/'; return; }
      var user = await authRes.json();

      var listEl = document.getElementById('replies-list');

      try {
        var res = await fetch(API + '?userId=' + user._id + '&sort=newest');
        if (!res.ok) throw new Error('fetch failed');
        var complaints = await res.json();

        // Only show posts that actually have replies
        var withReplies = complaints.filter(function (c) {
          return c.replies && c.replies.length > 0;
        });

        listEl.innerHTML = '';

        if (complaints.length === 0) {
          listEl.innerHTML =
            '<p class="empty-text">You haven\'t posted anything yet.<br>' +
            '<a href="/" style="color:var(--accent);font-weight:600">&#8592; Post your first complaint</a></p>';
          return;
        }

        if (withReplies.length === 0) {
          listEl.innerHTML =
            '<p class="empty-text">No one has replied to your posts yet.<br>' +
            'Check back soon &#128172;</p>';
          return;
        }

        var total = withReplies.reduce(function (n, c) { return n + c.replies.length; }, 0);
        var summary = document.createElement('p');
        summary.className = 'rp-summary';
        summary.textContent = total + (total === 1 ? ' reply' : ' replies') + ' across ' + withReplies.length + ' of your posts';
        listEl.appendChild(summary);

        withReplies.forEach(function (c) {
          listEl.appendChild(renderComplaintWithReplies(c));
        });
      } catch (e) {
        listEl.innerHTML = '<p class="empty-text">Could not load replies. Please refresh.</p>';
      }
    }());
  }());
  </script>
</body>
</html>
