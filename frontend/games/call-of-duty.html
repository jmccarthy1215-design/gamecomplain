  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { --accent: #C8A000; --accent-hover: #a88000; }

    .game-banner {
      background: linear-gradient(160deg, #070707 0%, #111108 60%, #0a0c08 100%);
      border: 1px solid rgba(200, 160, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    /* Subtle gold sweep top-right */
    .game-banner::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 100%; height: 100%;
      background: linear-gradient(225deg, rgba(200,160,0,0.08) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Thin gold line at bottom */
    .game-banner::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200,160,0,0.6), transparent);
      pointer-events: none;
    }

    .banner-title { color: #e8d080; letter-spacing: 0.04em; }

    .stat-n { color: #C8A000; }

    .banner-badge {
      display: inline-block;
      background: rgba(200,160,0,0.1);
      border: 1px solid rgba(200,160,0,0.35);
      color: #C8A000;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 3px;
      margin-bottom: 0.75rem;
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <script>window.NEXT_PUBLIC_API_URL = "https://gamecomplain.onrender.com";</script>
  <script src="/config.js"></script>
  <script src="/shared/navbar.js"></script>

  <div class="container">

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/" class="breadcrumb-link">Home</a>
      <span class="breadcrumb-sep">›</span>
      <a href="/" class="breadcrumb-link">Games</a>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">Call of Duty</span>
    </nav>

    <div class="game-banner">
      <div class="banner-badge">FPS / Tactical</div>
      <h1 class="banner-title">Call of Duty</h1>
      <p class="banner-sub">Weapon balance complaints, SBMM frustrations, and everything wrong with the latest CoD.</p>
      <div class="banner-stats">
        <div class="stat-block">
          <div class="stat-n">3.1k</div>
          <div class="stat-l">Complaints</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">22.4k</div>
          <div class="stat-l">Upvotes</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">5.8k</div>
          <div class="stat-l">Replies</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">#2</div>
          <div class="stat-l">Most Active</div>
        </div>
      </div>
    </div>

    <section class="feed-section">
      <div class="feed-bar">
        <span class="feed-label">Call of Duty Issues</span>
        <span class="feed-sort">&#9650; Top Voted</span>
      </div>
      <div id="complaints-list"><p class="loading-text">Loading complaints…</p></div>
    </section>
  </div>

  <script>window.PAGE_CONFIG = { game: 'Call of Duty', sort: 'votes' };</script>
  <script src="/shared/feed.js"></script>
</body>
</html>
