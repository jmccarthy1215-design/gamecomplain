<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Complaints — Game Complaints</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { --accent: #5D9B40; --accent-hover: #4a7f33; }

    .game-banner {
      background: linear-gradient(150deg, #0c1804 0%, #1a1006 60%, #0e1804 100%);
      border: 1px solid rgba(93, 155, 64, 0.35);
      position: relative;
      overflow: hidden;
    }

    /* Pixel-grid pattern overlay */
    .game-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(93,155,64,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(93,155,64,0.04) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
    }

    /* Earthy brown vignette bottom */
    .game-banner::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 60px;
      background: linear-gradient(to top, rgba(139,99,64,0.12), transparent);
      pointer-events: none;
    }

    .banner-title { color: #7fd94e; letter-spacing: 0.02em; }

    .stat-n { color: #5D9B40; }

    .banner-badge {
      display: inline-block;
      background: rgba(93,155,64,0.12);
      border: 1px solid rgba(93,155,64,0.4);
      color: #7fd94e;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 3px;
      margin-bottom: 0.75rem;
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <script>window.NEXT_PUBLIC_API_URL = "https://gamecomplain.onrender.com";</script>
  <script src="/config.js"></script>
  <script src="/shared/navbar.js"></script>

  <div class="container">

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/" class="breadcrumb-link">Home</a>
      <span class="breadcrumb-sep">›</span>
      <a href="/" class="breadcrumb-link">Games</a>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current">Minecraft</span>
    </nav>

    <div class="game-banner">
      <div class="banner-badge">Sandbox / Survival</div>
      <h1 class="banner-title">Minecraft</h1>
      <p class="banner-sub">Server lag, world gen bugs, mob AI issues, and update frustrations from the Minecraft community.</p>
      <div class="banner-stats">
        <div class="stat-block">
          <div class="stat-n">1.9k</div>
          <div class="stat-l">Complaints</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">11.2k</div>
          <div class="stat-l">Upvotes</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">3.4k</div>
          <div class="stat-l">Replies</div>
        </div>
        <div class="stat-block">
          <div class="stat-n">#4</div>
          <div class="stat-l">Most Active</div>
        </div>
      </div>
    </div>

    <section class="feed-section">
      <div class="feed-bar">
        <span class="feed-label">Minecraft Issues</span>
        <span class="feed-sort">&#9650; Top Voted</span>
      </div>
      <div id="complaints-list"><p class="loading-text">Loading complaints…</p></div>
    </section>
  </div>

  <script>window.PAGE_CONFIG = { game: 'Minecraft', sort: 'votes' };</script>
  <script src="/shared/feed.js"></script>
</body>
</html>
